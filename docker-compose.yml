version: '3.8'

services:
  gem-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gem-scraper-backend
    restart: unless-stopped
    ports:
      - "6001:6001"
    environment:
      - PORT=6001
      - PYTHONUNBUFFERED=1
      - SCHEDULER_INTERVAL=7200
    volumes:
      - ./scraped_output:/app/scraped_output
      - ./bids_input_sample.txt:/app/bids_input_sample.txt

  gem-frontend:
    build:
      context: ./next-app
      dockerfile: Dockerfile
    container_name: gem-dashboard-frontend
    restart: unless-stopped
    ports:
      - "6012:6012"
    environment:
      - PORT=6012
    depends_on:
      - gem-backend
